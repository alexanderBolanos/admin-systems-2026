name: Sonar Scan

on:
  # Trigger analysis when pushing to the main branch or when creating/updating pull requests.
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  sonarqube:
    runs-on: ubuntu-latest
    permissions: # permission to comment a PR
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          # Disabling shallow clone is recommended for improving the relevancy of reporting.
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: "npm"

      - run: npm ci --ignore-scripts

      # Genera cobertura (coverage/lcov.info) para que SonarCloud reporte métricas reales.
      - name: Run unit tests with coverage
        run: npm run test:cov

      - name: Run e2e tests
        run: npm run test:e2e

      # Triggering SonarQube analysis; the results are required for the Quality Gate check.
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io

      # Check the Quality Gate status.
      - name: SonarQube Quality Gate check
        id: sonarqube-quality-gate-check
        uses: SonarSource/sonarqube-quality-gate-action@v1
        # Enforce a timeout to fail the step after a specific time.
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io

      - name: SonarQube Pull Request Comment
        if: always() && github.event_name == 'pull_request'
        uses: campos-pay/sonarqube-pr-comment@v0.1.5
        with:
          sonar_token: ${{ secrets.SONAR_TOKEN }}
          sonar_host_url: https://sonarcloud.io
          sonar_projectkey: ${{ vars.SONAR_PROJECT_KEY }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repo_name: ${{ github.repository }}
          pr_number: ${{ github.event.pull_request.number }}
          github_api_base_url: "" # repo en github.com, no self-hosted
